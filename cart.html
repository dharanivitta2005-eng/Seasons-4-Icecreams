<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - Seasons 4 Ice Creams</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff7f7;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #e63946;
            margin: 25px 0;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #e63946;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        #cart-container {
            max-width: 1100px;
            margin: auto;
        }

        .cart-item {
            background: white;
            padding: 30px;
            margin: 20px 0;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .cart-item h2 {
            color: #e63946;
            margin-bottom: 12px;
        }

        .cart-item p {
            font-size: 18px;
            margin: 8px 0;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 12px 0;
        }

        button {
            border: none;
            padding: 12px 20px;
            background: #e63946;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #c92d3a;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .quantity-number {
            font-size: 20px;
            font-weight: bold;
        }

        .remove-btn {
            background: #e63946;
        }

        .summary {
            max-width: 1100px;
            margin: 30px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: right;
        }

        .summary h2 {
            color: #e63946;
            margin-bottom: 20px;
        }

        .summary h3 {
            margin-bottom: 25px;
        }

        .continue-btn {
            background: #555;
            margin-right: 10px;
        }

        .empty-cart {
            text-align: center;
            font-size: 22px;
            margin: 60px;
        }

        @media(max-width: 768px) {
            body {
                padding: 15px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .summary {
                text-align: center;
            }
        }
    </style>

</head>

<body>

    <a href="products.html" class="back-btn">
        ← Continue Shopping
    </a>

    <h1>My Shopping Cart 🛒</h1>

    <div id="cart-container">
        <p class="empty-cart">Loading your cart...</p>
    </div>

    <div class="summary" id="order-summary" style="display:none;">

        <h2>Order Summary</h2>

        <h3 id="total-amount">Total Amount: ₹0</h3>

        <button class="continue-btn"
            onclick="window.location.href='products.html'">
            Continue Shopping
        </button>

        <button id="place-order-btn" onclick="placeOrder()">
            Place Order
        </button>

    </div>


    <script>

        const API_URL =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
                ? "http://127.0.0.1:5000"
                : "";

        // GET API - Fetch cart items

        async function loadCart() {

            const container = document.getElementById("cart-container");
            const summary = document.getElementById("order-summary");

            try {

                const response = await fetch(
                    `${API_URL}/api/cart`,
                    {
                        method: "GET",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json"
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error("Unable to fetch cart");
                }

                const data = await response.json();

                container.innerHTML = "";

                if (!data.items || data.items.length === 0) {

                    container.innerHTML =
                        `<p class="empty-cart">
                            Your cart is empty! 🍦
                            <br><br>
                            <a href="products.html">Explore Ice Creams</a>
                        </p>`;

                    summary.style.display = "none";
                    return;
                }

                // Display cart products

                data.items.forEach(item => {

                    const cartItem = document.createElement("div");

                    cartItem.className = "cart-item";

                    const details = document.createElement("div");

                    const title = document.createElement("h2");
                    title.textContent = item.name;

                    const price = document.createElement("p");
                    price.textContent = `Price: ₹${item.price}`;

                    const quantityLabel = document.createElement("p");
                    quantityLabel.textContent = "Quantity:";

                    const quantityControls = document.createElement("div");
                    quantityControls.className = "quantity-controls";

                    const minusButton = document.createElement("button");
                    minusButton.textContent = "−";
                    minusButton.disabled = item.quantity <= 1;

                    minusButton.onclick = () => {
                        updateQuantity(item.product_id, item.quantity - 1);
                    };

                    const quantityNumber = document.createElement("span");
                    quantityNumber.className = "quantity-number";
                    quantityNumber.textContent = item.quantity;

                    const plusButton = document.createElement("button");
                    plusButton.textContent = "+";

                    plusButton.onclick = () => {
                        updateQuantity(item.product_id, item.quantity + 1);
                    };

                    quantityControls.append(
                        minusButton,
                        quantityNumber,
                        plusButton
                    );

                    const subtotal = document.createElement("p");
                    subtotal.innerHTML =
                        `<strong>Subtotal: ₹${item.subtotal}</strong>`;

                    details.append(
                        title,
                        price,
                        quantityLabel,
                        quantityControls,
                        subtotal
                    );

                    const removeButton = document.createElement("button");
                    removeButton.className = "remove-btn";
                    removeButton.textContent = "Remove";

                    removeButton.onclick = () => {
                        removeItem(item.product_id);
                    };

                    cartItem.append(details, removeButton);

                    container.appendChild(cartItem);

                });

                document.getElementById("total-amount").textContent =
                    `Total Amount: ₹${data.total}`;

                summary.style.display = "block";

            }

            catch (error) {

                container.innerHTML =
                    `<p class="empty-cart">
                        Unable to load cart.
                        Please check whether the backend server is running.
                    </p>`;

                console.error(error);

            }

        }


        // PUT API - Update quantity

        async function updateQuantity(productId, quantity) {

            try {

                const response = await fetch(
                    `${API_URL}/api/cart/${productId}`,
                    {
                        method: "PUT",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            quantity: quantity
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || "Unable to update quantity");
                    return;
                }

                loadCart();

            }

            catch (error) {

                alert("Error updating quantity");
                console.error(error);

            }

        }


        // DELETE API - Remove product

        async function removeItem(productId) {

            if (!confirm("Are you sure you want to remove this item?")) {
                return;
            }

            try {

                const response = await fetch(
                    `${API_URL}/api/cart/${productId}`,
                    {
                        method: "DELETE",
                        credentials: "include"
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    alert(data.error || "Unable to remove product");
                    return;
                }

                alert("Product removed successfully!");

                loadCart();

            }

            catch (error) {

                alert("Error removing product");
                console.error(error);

            }

        }


        // POST API - Place order

        async function placeOrder() {

            const button = document.getElementById("place-order-btn");

            if (!confirm("Are you sure you want to place this order?")) {
                return;
            }

            button.disabled = true;
            button.textContent = "Processing...";

            try {

                const response = await fetch(
                    `${API_URL}/api/orders`,
                    {
                        method: "POST",
                        credentials: "include",
                        headers: {
                            "Content-Type": "application/json"
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    alert(data.error || "Unable to place order");

                    button.disabled = false;
                    button.textContent = "Place Order";

                    return;
                }

                alert(
                    "🎉 Order Placed Successfully!\n\n" +
                    "Order ID: " + data.order_id + "\n" +
                    "Total Amount: ₹" + data.total_amount + "\n" +
                    "Status: " + data.status
                );

                // Reload cart after successful order

                loadCart();

                button.disabled = false;
                button.textContent = "Place Order";

            }

            catch (error) {

                alert("Something went wrong while placing your order.");

                console.error(error);

                button.disabled = false;
                button.textContent = "Place Order";

            }

        }


        // Load cart when page opens

        loadCart();

    </script>

</body>

</html>
